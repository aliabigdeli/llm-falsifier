<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .d { stroke: #5e6e84; }
    .b { stroke: #2356c4; }
    .r { stroke: #cf2339; }
    @media (prefers-color-scheme: dark) {
      .d { stroke: #a9bdd5; }
      .b { stroke: #8dc3ff; }
      .r { stroke: #ff7b70; }
    }
  </style>
  <!-- the LLM-Falsifier mark: a trace crossing the dashed spec bound, blue while it holds, red once it is violated -->
  <defs>
    <path id="trace" d="M2.2 28C9.5 25.2 13.9 16.9 17.6 12.3S25.7 4.7 29.8 4" fill="none" stroke-width="3.6" stroke-linecap="round"/>
    <clipPath id="below"><rect x="0" y="12.3" width="32" height="19.7"/></clipPath>
  </defs>
  <path class="d" d="M2 12.3H30" fill="none" stroke-width="2" stroke-dasharray="3 3"/>
  <use href="#trace" class="r"/>
  <use href="#trace" class="b" clip-path="url(#below)"/>
</svg>
